name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check app lab scripts tests

  test:
    name: unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      # -ll = fail only on MEDIUM and HIGH. The four LOW findings are documented
      # defensive try/except blocks (see SECURITY-CICD-REPORT.md §4).
      - run: bandit -ll -r app -f txt

  deps:
    name: dependencies (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  secrets:
    name: secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # full history: a secret deleted in a later commit is still a leak
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: container (hadolint + trivy)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Build image
        run: docker build -t aegis-soc:ci .

      - name: Scan image (fail on actionable vulns)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: aegis-soc:ci
          severity: HIGH,CRITICAL
          # --ignore-unfixed is the important flag: it fails only on findings that
          # can actually be remediated. The 44 HIGH OS findings in this image have
          # no fixed version upstream, so failing on them would train people to
          # ignore the gate. They are still reported in the SARIF artifact below.
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Full report (non-blocking, for the record)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: aegis-soc:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          format: sarif
          output: trivy-results.sarif

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sarif
          path: trivy-results.sarif

      - name: Functional smoke test against the built image
        run: |
          docker run -d --name smoke -p 8080:8080 \
            -e STORE=sqlite -e SQLITE_PATH=/tmp/smoke.db -e AUTO_TRIAGE=1 aegis-soc:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/api/health && break || sleep 1
          done
          curl -sf http://127.0.0.1:8080/api/health | grep -q '"status":"ok"'
          ALERTS=$(curl -s -X POST http://127.0.0.1:8080/api/simulate/attack | python3 -c 'import sys,json;print(json.load(sys.stdin)["alerts"])')
          echo "alerts produced: $ALERTS"
          test "$ALERTS" -ge 10
          docker rm -f smoke
