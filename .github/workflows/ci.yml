name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "ruff>=0.17,<1"
      - run: ruff check app lab scripts tests

  test:
    name: unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "bandit>=1.9,<2"
      # -ll = fail only on MEDIUM and HIGH. The four LOW findings are documented
      # defensive try/except blocks (see SECURITY-CICD-REPORT.md §4.6).
      - run: bandit -ll -r app -f txt

  deps:
    name: dependencies (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "pip-audit>=2.10,<3"
      - name: Audit runtime dependencies (what ships)
        run: pip-audit -r requirements.txt
      - name: Audit dev dependencies (what CI runs)
        run: pip-audit -r requirements-dev.txt

  secrets:
    name: secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # full history: a secret deleted later is still a leak
      # CLI rather than gitleaks-action: the action requires a paid licence for
      # organisation accounts (this repo is an org), the CLI does not.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD":/repo zricethezav/gitleaks:latest \
            detect --source=/repo --no-banner --redact --verbose

  container:
    name: container (hadolint + trivy + smoke)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      # Plain `docker run` instead of marketplace actions: no pin-drift
      # (aquasecurity/trivy-action@0.28.0 does not exist), no licence gate.
      - name: Lint Dockerfile (hadolint)
        run: docker run --rm -i hadolint/hadolint:latest < Dockerfile

      - name: Build image
        run: docker build -t aegis-soc:ci .

      - name: Scan image — fail on actionable findings only
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --quiet --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 aegis-soc:ci

      - name: Scan image — full inventory (informational)
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --quiet --severity HIGH,CRITICAL \
            aegis-soc:ci 2>/dev/null | grep -E "^Total:" || true

      - name: Functional smoke test
        run: |
          docker run -d --name smoke -p 8080:8080 \
            -e STORE=sqlite -e SQLITE_PATH=/tmp/smoke.db -e AUTO_TRIAGE=1 aegis-soc:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/api/health && break || sleep 1
          done
          curl -sf http://127.0.0.1:8080/api/health | grep -q '"status":"ok"'
          ALERTS=$(curl -s -X POST http://127.0.0.1:8080/api/simulate/attack \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["alerts"])')
          echo "alerts produced: $ALERTS"
          test "$ALERTS" -ge 10
          docker rm -f smoke
