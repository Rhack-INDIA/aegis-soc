# gitleaks configuration.
#
# Extends the default rule set — nothing is disabled, so real secrets are still
# caught. The allowlist only covers a known false positive that is generated by
# the scanners themselves rather than written by a human.

[extend]
useDefault = true

[allowlist]
description = "Scanner output and public base-image metadata"

# Trivy JSON embeds the official python image's environment, which includes
# GPG_KEY=<public key>. It is a published, non-secret value from a public base
# image — flagged by the generic-api-key entropy rule.
regexes = [
  '''GPG_KEY''',
]

# Generated scan artefacts are not source. They are no longer committed (see
# .gitignore), but earlier commits still contain them and history is scanned.
paths = [
  '''evals/security/trivy\.json''',
  '''evals/security/trivy_after\.txt''',
]
